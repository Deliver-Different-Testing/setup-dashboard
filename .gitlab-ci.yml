include:
  - project: 'deliver-different/ci-templates'
    file: 'ci-template.yml'
    ref: 'main'

# Unit tests run first on every push. The template's templating/deploy stages only start once
# they pass, so a red test blocks the deploy pipeline, and the project's "Pipelines must
# succeed" setting blocks the merge.
stages:
  - test
  - templating
  - deploy

dotnet-test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    # The private DeliverDifferent.AccessControl feed (see nuget.config).
    GITLAB_NUGET_USERNAME: gitlab-ci-token
    GITLAB_NUGET_TOKEN: $CI_JOB_TOKEN
  script:
    # The test project sets SkipNpm, so the frontend build is left to client-test.
    - dotnet test SetupDashboard.Tests/SetupDashboard.Tests.csproj

client-test:
  stage: test
  image: node:22
  cache:
    key:
      files:
        - SetupDashboard.Client/package-lock.json
    paths:
      - SetupDashboard.Client/.npm/
  before_script:
    - cd SetupDashboard.Client
    - npm ci --cache .npm --prefer-offline
  script:
    - npx tsc -b
    - npm test
